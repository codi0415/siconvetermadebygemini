
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brainspark 001</title>
    
    <!-- Tailwind CSS (스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (브라우저에서 JSX 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 추가적인 커스텀 스타일이 필요한 경우 여기에 작성 */
        body { margin: 0; padding: 0; box-sizing: border-box; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body>
    <!-- React 앱이 마운트될 루트 요소 -->
    <div id="root"></div>

    <!-- React 컴포넌트 코드 -->
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // 아이콘 컴포넌트 (Lucide-react 대체용 SVG)
        const LayersIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-600">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 12 12 17 22 12"></polyline>
                <polyline points="2 17 12 22 22 17"></polyline>
            </svg>
        );
        const BookOpenIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        );
        const RefreshIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                <path d="M16 21v-5h5"></path>
            </svg>
        );
        const ArrowLeftIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
            </svg>
        );
        const ArrowRightIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
            </svg>
        );

        const ALL_PREFIXES = [
            { mag: "10^{24}", prefix: "요타(yotta)", sym: "Y", isCommon: false },
            { mag: "10^{21}", prefix: "제타(zetta)", sym: "Z", isCommon: false },
            { mag: "10^{18}", prefix: "엑사(exa)", sym: "E", isCommon: false },
            { mag: "10^{15}", prefix: "페타(peta)", sym: "P", isCommon: false },
            { mag: "10^{12}", prefix: "테라(tera)", sym: "T", isCommon: false },
            { mag: "10^{9}", prefix: "기가(giga)", sym: "G", isCommon: true },
            { mag: "10^{6}", prefix: "메가(mega)", sym: "M", isCommon: true },
            { mag: "10^{3}", prefix: "킬로(kilo)", sym: "k", isCommon: true },
            { mag: "10^{2}", prefix: "헥토(hecto)", sym: "h", isCommon: false },
            { mag: "10^{1}", prefix: "데카(deka)", sym: "da", isCommon: false },
            { mag: "10^{-1}", prefix: "데시(deci)", sym: "d", isCommon: false },
            { mag: "10^{-2}", prefix: "센티(centi)", sym: "c", isCommon: true },
            { mag: "10^{-3}", prefix: "밀리(milli)", sym: "m", isCommon: true },
            { mag: "10^{-6}", prefix: "마이크로(micro)", sym: "μ", isCommon: true },
            { mag: "10^{-9}", prefix: "나노(nano)", sym: "n", isCommon: true },
            { mag: "10^{-12}", prefix: "피코(pico)", sym: "p", isCommon: true },
            { mag: "10^{-15}", prefix: "펨토(femto)", sym: "f", isCommon: false },
            { mag: "10^{-18}", prefix: "아토(atto)", sym: "a", isCommon: false },
            { mag: "10^{-21}", prefix: "젭토(zepto)", sym: "z", isCommon: false },
            { mag: "10^{-24}", prefix: "욕토(yocto)", sym: "y", isCommon: false }
        ];

        function App() {
            const [cards, setCards] = useState(ALL_PREFIXES);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [showOnlyCommon, setShowOnlyCommon] = useState(false);
            const [questionType, setQuestionType] = useState('magnitude'); // 'magnitude' or 'prefix'

            useEffect(() => {
                const filteredCards = showOnlyCommon 
                    ? ALL_PREFIXES.filter(c => c.isCommon) 
                    : ALL_PREFIXES;
                setCards(filteredCards);
                setCurrentIndex(0);
                setIsFlipped(false);
            }, [showOnlyCommon]);

            const handleNext = useCallback(() => {
                setIsFlipped(false);
                setTimeout(() => {
                    setCurrentIndex((prev) => (prev + 1) % cards.length);
                }, 150);
            }, [cards.length]);

            const handlePrev = useCallback(() => {
                setIsFlipped(false);
                setTimeout(() => {
                    setCurrentIndex((prev) => (prev - 1 + cards.length) % cards.length);
                }, 150);
            }, [cards.length]);

            const handleShuffle = () => {
                setIsFlipped(false);
                setTimeout(() => {
                    const shuffled = [...cards].sort(() => Math.random() - 0.5);
                    setCards(shuffled);
                    setCurrentIndex(0);
                }, 150);
            };

            const toggleQuestionType = () => {
                setIsFlipped(false);
                setTimeout(() => {
                    setQuestionType(prev => prev === 'magnitude' ? 'prefix' : 'magnitude');
                }, 150);
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') {
                        handleNext();
                    } else if (e.key === 'ArrowLeft') {
                        handlePrev();
                    } else if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                        setIsFlipped((prev) => !prev);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleNext, handlePrev]);

            const formatMagnitude = (magStr) => {
                const parts = magStr.split('^{');
                if (parts.length === 2) {
                    const base = parts[0];
                    const exp = parts[1].replace('}', '');
                    return <span className="flex items-start">{base}<sup className="text-4xl mt-2 ml-1">{exp}</sup></span>;
                }
                return magStr;
            };

            const currentCard = cards[currentIndex];

            const FrontContent = () => (
                <div className="flex flex-col items-center justify-center h-full text-gray-800">
                    <span className="text-sm font-medium text-blue-500 mb-4 tracking-wider uppercase">
                        {questionType === 'magnitude' ? '크기' : '접두어'}
                    </span>
                    <div className="text-7xl font-bold flex items-center justify-center w-full break-keep text-center px-4">
                        {questionType === 'magnitude' ? formatMagnitude(currentCard.mag) : currentCard.prefix}
                    </div>
                    {questionType === 'prefix' && (
                        <div className="text-3xl text-gray-400 mt-4 font-semibold">
                            {currentCard.sym}
                        </div>
                    )}
                </div>
            );

            const BackContent = () => (
                <div className="flex flex-col items-center justify-center h-full text-white bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl">
                    <span className="text-sm font-medium text-blue-200 mb-4 tracking-wider uppercase">
                        {questionType === 'magnitude' ? '접두어 및 기호' : '크기'}
                    </span>
                    {questionType === 'magnitude' ? (
                        <React.Fragment>
                            <div className="text-5xl font-bold mb-6 text-center px-4 break-keep">
                                {currentCard.prefix}
                            </div>
                            <div className="text-6xl font-black bg-white/20 px-8 py-4 rounded-2xl shadow-inner">
                                {currentCard.sym}
                            </div>
                        </React.Fragment>
                    ) : (
                        <div className="text-7xl font-bold flex items-center justify-center w-full">
                            {formatMagnitude(currentCard.mag)}
                        </div>
                    )}
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center py-10 px-4 font-sans text-slate-800">
                    <div className="max-w-2xl w-full flex flex-col sm:flex-row items-center justify-between mb-8 gap-4">
                        <div className="flex flex-col items-center sm:items-start text-center sm:text-left">
                            <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                                <LayersIcon /> BrainSpark : 접두어 플래시카드
                            </h2>
                            <p className="text-slate-500 text-sm mt-1"></p>
                        </div>
                        
                        BRAINSPARK series : 001
                        <div className="flex bg-white rounded-lg shadow-sm border border-slate-200 p-1">
                            <button
                                onClick={() => setShowOnlyCommon(false)}
                                className={`px-4 py-2 text-sm font-semibold rounded-md transition-colors ${!showOnlyCommon ? 'bg-blue-50 text-blue-700' : 'text-slate-500 hover:bg-slate-50'}`}
                            >
                                전체 보기
                            </button>
                            <button
                                onClick={() => setShowOnlyCommon(true)}
                                className={`px-4 py-2 text-sm font-semibold rounded-md transition-colors ${showOnlyCommon ? 'bg-blue-50 text-blue-700' : 'text-slate-500 hover:bg-slate-50'}`}
                            >
                                자주 쓰는 단위만
                            </button>
                        </div>
                    </div>

                    <div className="max-w-md w-full flex justify-between items-center mb-6">
                        <button
                            onClick={toggleQuestionType}
                            className="flex items-center gap-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 px-4 py-2 rounded-full hover:bg-slate-50 transition shadow-sm"
                        >
                            <BookOpenIcon />
                            {questionType === 'magnitude' ? '크기로 맞추기' : '이름으로 맞추기'}
                        </button>
                        
                        <button
                            onClick={handleShuffle}
                            className="flex items-center gap-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 px-4 py-2 rounded-full hover:bg-slate-50 transition shadow-sm"
                        >
                            <RefreshIcon /> 섞기
                        </button>
                    </div>

                    <div className="max-w-md w-full mb-4 flex justify-center items-center gap-2 text-slate-400 font-semibold text-sm">
                        <span>{currentIndex + 1}</span>
                        <span>/</span>
                        <span>{cards.length}</span>
                    </div>

                    <div 
                        className="w-full max-w-md aspect-[4/3] sm:aspect-video md:aspect-[4/3] mb-8 cursor-pointer group"
                        style={{ perspective: '1000px' }}
                        onClick={() => setIsFlipped(!isFlipped)}
                    >
                        <div className={`relative w-full h-full transition-transform duration-500 preserve-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                            <div className="absolute inset-0 w-full h-full backface-hidden bg-white rounded-3xl shadow-xl border border-slate-100 group-hover:shadow-2xl transition-shadow">
                                <FrontContent />
                            </div>
                            <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-3xl shadow-xl">
                                <BackContent />
                            </div>
                        </div>
                    </div>

                    <div className="flex items-center gap-6">
                        <button
                            onClick={(e) => { e.stopPropagation(); handlePrev(); }}
                            className="p-4 rounded-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:text-blue-600 shadow-sm transition-all focus:outline-none focus:ring-4 focus:ring-blue-100"
                            aria-label="이전 카드"
                        >
                            <ArrowLeftIcon />
                        </button>

                        <p className="text-slate-400 text-xs text-center hidden sm:block">
                            클릭하거나 스페이스바를 눌러 뒤집기 <br/>
                            방향키로 이동
                        </p>

                        <button
                            onClick={(e) => { e.stopPropagation(); handleNext(); }}
                            className="p-4 rounded-full bg-blue-600 text-white shadow-md hover:bg-blue-700 hover:shadow-lg transition-all focus:outline-none focus:ring-4 focus:ring-blue-300"
                            aria-label="다음 카드"
                        >
                            <ArrowRightIcon />
                        </button>
                    </div>
                </div>
            );
        }

        // 앱 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
